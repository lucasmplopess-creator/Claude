spring.application.name=ideias360

server.port=${PORT:8080}

# Banco de dados — em producao, SEMPRE defina DB_URL/DB_USERNAME/DB_PASSWORD
# como variaveis de ambiente. Os valores abaixo (depois do ":") sao apenas
# fallback para rodar localmente em desenvolvimento.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ideias360}
spring.datasource.username=${DB_USERNAME:ideias360}
spring.datasource.password=${DB_PASSWORD:ideias360_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema e' controlado pelas migrations do Flyway (db/migration) -
# o Hibernate so' valida que a entidade bate com as tabelas, nunca altera o banco sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Usuario com acesso a' tela "Consultar Ideias Enviadas".
# Defina ADMIN_USERNAME/ADMIN_PASSWORD como variaveis de ambiente antes de subir em producao.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

spring.jackson.deserialization.fail-on-unknown-properties=false

# Nao expor detalhes internos de erro (stack trace) nas respostas da API.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
